; Runtime tuning for the Ryzen 5 5600X / 30 GiB host.
memory_limit=2G
upload_max_filesize=16G
post_max_size=16G
max_execution_time=3600
max_input_time=3600
output_buffering=0

; Keep the bytecode and interned-string caches comfortably sized for apps.
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=20000
opcache.revalidate_freq=60
apc.enable_cli=1
